<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#252b2b">
<meta name="description" content="Read Almost by M. Farouk. Some people are meant to meet, not to stay.">
<title>Almost | M. Farouk</title>
<!-- Optional web font matching the manuscript; Georgia is used when offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ===== Theme tokens: palette and fonts drawn from the front cover ===== */
:root{
  color-scheme:light dark;
  --paper:#fbf7ef;--ink:#262522;--edge:#d9cfbd;--accent:#d08a55;
  --ui:#efe2cc;--ui-dim:#c9b79b;--night:#1f2a2d;--dusk:#4a3f3a;--ember:#b8693f;
  --book-serif:'Noto Serif',Georgia,'Times New Roman',serif;
  --ui-serif:Georgia,'Times New Roman',serif;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#24272a;--ink:#e6dfd1;--edge:#3a3d3e}}
:root[data-theme=dark]{--paper:#24272a;--ink:#e6dfd1;--edge:#3a3d3e}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--ui-serif);color:var(--ui);background:var(--night);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid #e7ae78;outline-offset:4px}
button:disabled{opacity:.35;cursor:default}
[hidden]{display:none!important}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===== Background: dusk sky over the Nile, from the cover artwork ===== */
.world{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(ellipse 70% 40% at 70% 78%,rgba(240,140,70,.32),transparent 70%),
  radial-gradient(ellipse 60% 30% at 20% 85%,rgba(200,90,60,.18),transparent 70%),
  linear-gradient(180deg,#1b2629 0%,#2b3236 38%,var(--dusk) 70%,#2a2422 100%)}
.world::after{content:"";position:absolute;left:0;right:0;bottom:0;height:18%;
  background:repeating-linear-gradient(90deg,rgba(255,196,120,.05) 0 2px,transparent 2px 38px),linear-gradient(180deg,transparent,rgba(10,14,15,.55))}

/* ===== Layout regions ===== */
.masthead{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;color:var(--ui);z-index:5;opacity:0;transition:opacity .4s;pointer-events:none}
.reading .masthead{opacity:1}
.wordmark{font-style:italic;font-size:22px}
.wordmark small{font-style:normal;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--ui-dim);margin-left:10px}
.chapter-name{font-size:12px;letter-spacing:1px;color:var(--ui-dim);max-width:55%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{position:fixed;left:0;right:0;top:var(--top,52px);bottom:var(--bottom,150px);display:flex;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
body:not(.pan) main{overflow:hidden}

/* ===== Closed book ===== */
.cover-scene{position:fixed;inset:0 0 64px 0;display:flex;align-items:center;justify-content:center;perspective:1600px;z-index:3}
.cover-group{position:relative;text-align:center;animation:arrive 1.2s cubic-bezier(.16,1,.3,1) both}
.cover-book{position:relative;display:block;padding:0;border:0;background:#1a2226;height:min(72vh,680px);width:calc(min(72vh,680px) * .686);max-width:calc(100vw - 80px);border-radius:2px 6px 6px 2px;transform:rotateY(-10deg);transform-style:preserve-3d;transform-origin:left center;box-shadow:22px 28px 60px rgba(0,0,0,.55);transition:transform .7s ease}
@supports(height:1dvh){.cover-book{height:min(72dvh,680px);width:calc(min(72dvh,680px) * .686)}}
.cover-book:hover{transform:rotateY(-4deg)}
.cover-book img.face{display:block;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.cover-book img.spine{position:absolute;top:0;left:-30px;width:30px;height:100%;object-fit:cover;transform:rotateY(-60deg);transform-origin:right center;filter:brightness(.72);border-radius:3px 0 0 3px}
.cover-book::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 6px 0 10px rgba(0,0,0,.45),inset -1px 0 2px rgba(255,220,180,.4)}
.back .cover-book{transform:rotateY(10deg);transform-origin:right center}
.back .cover-book img.spine{left:auto;right:-30px;transform:rotateY(60deg);transform-origin:left center}
.opening .cover-book{transform:rotateY(-100deg);opacity:0;transition:transform .8s cubic-bezier(.4,0,.2,1),opacity .8s}
.hint{margin-top:22px;font-size:13px;letter-spacing:2px;color:var(--ui);animation:pulse 2.4s ease-in-out infinite}
.resume{margin-top:6px;font-size:12px;font-style:italic;color:var(--ui-dim)}

/* ===== Open book ===== */
.stage{position:relative;display:flex;align-items:center;gap:14px;margin:auto;padding:8px;opacity:0;transition:opacity .5s}
.reading .stage{opacity:1}
.book{position:relative;flex:0 0 auto;display:flex;width:var(--book-w);height:var(--book-h);perspective:2400px;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;
  box-shadow:0 26px 50px rgba(0,0,0,.45),0 2px 0 var(--edge),0 4px 0 #b9ab92,0 6px 0 var(--edge),0 8px 0 #2b3134;border-radius:3px}
.page{position:relative;flex:1 1 0;min-width:0;height:100%;background:var(--paper);color:var(--ink);overflow:hidden}
.book .page:first-child{border-radius:3px 0 0 3px;box-shadow:inset -18px 0 24px -18px rgba(90,60,30,.35)}
.book .page:last-child{border-radius:0 3px 3px 0;box-shadow:inset 18px 0 24px -18px rgba(90,60,30,.35)}
.single .book .page{border-radius:3px;box-shadow:inset 10px 0 18px -14px rgba(90,60,30,.3)}
.book.dragging{cursor:grabbing}
.fit{position:relative;overflow:hidden}
/* Taller than the screen (phone landscape): the book scrolls vertically. */
.pan .book{touch-action:auto;cursor:default}
body.pan .nav{display:grid;position:fixed;top:50%;margin-top:-23px;z-index:8;background:rgba(20,28,30,.7)}
.pan #prev{left:8px}.pan #next{right:8px}
/* Each sheet is laid out in PDF points, then scaled to the page box. */
.sheet{position:absolute;left:0;top:0;transform-origin:0 0;font-family:var(--book-serif)}
.ln{position:absolute;white-space:pre;line-height:1;transform-origin:0 0}
.ln .i{font-style:italic}.ln .b{font-weight:700}
/* Reflowed text (sizes other than 100%) inside the manuscript's own text frame. */
.flow{position:absolute;line-height:1.561;text-align:justify;hyphens:auto;-webkit-hyphens:auto;font-family:var(--book-serif)}
.flow p{margin:0 0 .435em;text-indent:1.357em}
.flow p.noindent{text-indent:0}
.flow p.split{text-align-last:justify}
.flow p.center{text-align:center;text-indent:0;margin-bottom:1.2em}
.flow .i,.display .i{font-style:italic}.flow .b,.display .b{font-weight:700}
.display{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 70px 40px;text-align:center;line-height:1.45}
.folio{position:absolute;left:0;right:0;text-align:center;line-height:1;font-size:11.5px}
#measure{left:-99999px;top:0;visibility:hidden}
.toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);z-index:9;padding:7px 14px;border-radius:16px;background:rgba(20,28,30,.92);color:var(--ui);font-size:12px;letter-spacing:.5px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.blank{background:var(--paper)}
.nav{flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:1px solid rgba(239,226,204,.25);background:rgba(20,28,30,.35);color:var(--ui);display:grid;place-items:center}
.nav:hover{background:rgba(239,226,204,.12)}
.single .nav{display:none}

/* Turning leaf: two faces, driven frame by frame from script. */
.leaf{position:absolute;top:0;height:100%;z-index:4;transform-style:preserve-3d;pointer-events:none;will-change:transform}
.leaf .page{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 0 18px rgba(0,0,0,.18)}
.leaf .back-face{transform:rotateY(180deg)}
.shade{position:absolute;inset:0;pointer-events:none;opacity:0}
.cast{position:absolute;top:0;height:100%;z-index:3;pointer-events:none}

/* ===== Footer: progress and controls ===== */
.footer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(60px + env(safe-area-inset-bottom));width:min(560px,calc(100% - 24px));z-index:6}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ui-dim);padding:0 4px 6px}
.track{height:3px;background:rgba(239,226,204,.18);border-radius:2px;overflow:hidden}
.track span{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
.tools{display:flex;justify-content:center;align-items:center;gap:4px;margin-top:6px}
.tool{width:44px;height:44px;border:0;border-radius:8px;background:transparent;color:var(--ui);display:grid;place-items:center}
.tool:hover{background:rgba(239,226,204,.12)}
.sep{width:1px;height:20px;background:rgba(239,226,204,.2);margin:0 4px}
.zoom-val{min-width:44px;text-align:center;font-size:12px;color:var(--ui-dim)}
.covers{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:12px;z-index:7}
.covers button{min-height:44px;padding:0 20px;border-radius:6px;border:1px solid rgba(239,226,204,.35);background:rgba(20,28,30,.75);color:var(--ui);font-size:12px;letter-spacing:2px}
.covers button:hover,.covers button[aria-current=true]{background:var(--ember);border-color:var(--ember);color:#fff}

/* ===== Closing screen ===== */
.end{position:fixed;inset:0 0 64px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;animation:arrive .9s both;z-index:3}
.end h1{font-size:clamp(44px,9vw,80px);font-weight:400;font-style:italic;margin:0 0 10px}
.end p{font-style:italic;color:var(--ui-dim);margin:0 0 26px;line-height:1.7}
.end button{min-height:46px;padding:0 26px;border-radius:24px;border:1px solid var(--accent);background:transparent;color:var(--ui);letter-spacing:1px;margin:6px}
.end button.primary{background:var(--accent);color:#1f1a16}

/* ===== Contents dialog ===== */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,14,15,.7);display:flex;align-items:center;justify-content:center;padding:16px}
.contents{width:min(440px,100%);max-height:85vh;overflow:auto;background:var(--paper);color:var(--ink);border-radius:8px;padding:20px 22px;font-family:var(--book-serif)}
.contents header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.contents h2{margin:0;font-size:22px;font-weight:400}
.contents .tool{color:var(--ink)}
.chapter{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--edge);background:none;color:var(--ink);padding:12px 2px;font-family:inherit;font-size:15px}
.chapter small{display:block;font-size:10px;letter-spacing:2px;opacity:.65}
.chapter:hover{color:var(--accent)}

@keyframes arrive{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.45}}
@media(max-width:600px){.wordmark small{display:none}.masthead{padding:0 14px}.tool{width:40px}.covers button{padding:0 14px}}
@media(max-height:520px){.masthead{height:34px}.wordmark{font-size:17px}.footer{bottom:calc(52px + env(safe-area-inset-bottom))}.meta{padding-bottom:2px}.tools{margin-top:2px}.tool{height:38px}.covers{bottom:6px}.covers button{min-height:38px}.hint{margin-top:10px}.cover-book{height:min(68vh,680px);width:calc(min(68vh,680px) * .686)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="world" aria-hidden="true"></div>

<header class="masthead"><div class="wordmark">Almost<small>M. Farouk</small></div><div class="chapter-name" id="chapterName"></div></header>

<section class="cover-scene" id="coverScene" aria-label="Book cover">
  <div class="cover-group">
    <button class="cover-book" id="coverBook" type="button"><img class="spine" id="spine" alt=""><img class="face" id="coverFace" alt=""></button>
    <div class="hint" id="hint">Tap, click or swipe to open</div>
    <div class="resume" id="resume"></div>
  </div>
</section>

<main id="main" hidden>
  <div class="stage" id="stage">
    <button class="nav" id="prev" type="button" aria-label="Previous page"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="book" id="book" tabindex="0" role="region" aria-label="Book pages. Use the left and right arrow keys to turn pages." aria-roledescription="book">
      <article class="page" id="pageA"></article><article class="page" id="pageB"></article>
    </div>
    <button class="nav" id="next" type="button" aria-label="Next page"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
  </div>
</main>

<section class="end" id="endScreen" hidden aria-labelledby="endTitle">
  <h1 id="endTitle">The End</h1>
  <p>Some love stories end.<br>Others remain almost.</p>
  <div><button class="primary" id="restart" type="button">Start over</button><button id="endBack" type="button">See back cover</button></div>
</section>

<footer class="footer" id="footer" hidden>
  <div class="meta"><span id="indicator" aria-live="polite"></span><span id="percent"></span></div>
  <div class="track" role="progressbar" aria-label="Reading progress" aria-valuemin="0" aria-valuemax="100" id="progress"><span id="bar"></span></div>
  <nav class="tools" aria-label="Reader controls">
    <button class="tool" id="startBtn" type="button" aria-label="Go to start" title="Go to start"><svg viewBox="0 0 24 24"><path d="M6 5v14M18 6l-8 6 8 6z"/></svg></button>
    <button class="tool" id="contentsBtn" type="button" aria-label="Chapters" title="Chapters"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
    <span class="sep"></span>
    <button class="tool" id="zoomOut" type="button" aria-label="Smaller text" title="Smaller text"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <span class="zoom-val" id="zoomVal" title="Text size">100%</span>
    <button class="tool" id="zoomIn" type="button" aria-label="Larger text" title="Larger text"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
    <span class="sep"></span>
    <button class="tool" id="themeBtn" type="button" aria-label="Switch light or dark pages" title="Light / dark"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    <button class="tool" id="fullBtn" type="button" aria-label="Full screen" title="Full screen"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg></button>
  </nav>
</footer>

<nav class="covers" aria-label="Covers">
  <button id="frontBtn" type="button">FRONT COVER</button>
  <button id="backBtn" type="button">BACK COVER</button>
</nav>

<div class="overlay" id="overlay" hidden>
  <div class="contents" role="dialog" aria-modal="true" aria-labelledby="contentsTitle">
    <header><h2 id="contentsTitle">Contents</h2><button class="tool" id="closeContents" type="button" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
    <div id="chapterList"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="flow" id="measure" aria-hidden="true"></div>

<script>
/* ===== Book data: manuscript pages (lines in PDF points) and cover art, embedded at build time ===== */
/*__BOOK_DATA__*/
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  var saved = load();
  var textScale = SIZES.indexOf(+saved.text) >= 0 ? +saved.text : 1;
  var pendingSrc = Math.max(0, Math.min(N - 1, saved.src | 0));
  var flow = null, flowCache = {}, page = 0;   // flow: reflowed pages for the current text size
  if (saved.theme) document.documentElement.setAttribute('data-theme', saved.theme);

  function step() { return spread ? 2 : 1; }
  function count() { return flow ? flow.pages.length : N; }
  function srcOf(i) { return flow ? (flow.pages[Math.min(i, flow.pages.length - 1)] || { src: 0 }).src : i; }

    if (!flow) return src;
    var best = 0;

    return best;
  }

  function wordText(w) { var s = ''; w.forEach(function (seg) { s += seg[0]; }); return s; }
  function addLine(p, l, src) {
    var cur = null;
    if (p.words.length && /[A-Za-z]-$/.test(wordText(p.words[p.words.length - 1])) && /^[a-z]/.test(lineText(l))) cur = p.words.pop();

    l.r.forEach(function (run) {
      for (var k = 0; k < run[0].length; k++) {

  }

    var lines = pg.l.filter(function (l) { return !isFolio(l); }), para = null;
    if (!lines.length) return;

      frame.l = Math.min(frame.l, l.x); frame.t = Math.min(frame.t, l.y - l.s); frame.b = Math.max(frame.b, l.y + l.s * 0.35);
      if (l.x > margin + 60 && isCentered(l)) { para = { center: true, indent: false, words: [], marks: [] }; blocks.push(para); addLine(para, l, i); para = null; return; }
      var indented = l.x > margin + 6;
      if (!para || indented) { para = { indent: indented, words: [], marks: [] }; blocks.push(para); }

  });

  function srcAt(b, a) { var s = b.marks[0][1]; b.marks.forEach(function (m) { if (m[0] <= a) s = m[1]; }); return s; }
  function fillWords(el, words, a, z) {

    fillWords(p, b.words, a, z);
    return p;
  }
  // Fills pages of the manuscript's text frame at a given size, splitting paragraphs between words.
  function paginate(ts) {
    var M = $('measure'), H = frame.b - frame.t, pages = [], pg = null;
    M.style.width = (frame.r - frame.l) + 'px'; M.style.height = H + 'px'; M.style.fontSize = 11.5 * ts + 'px';
    function fits() { var last = M.lastChild; return last.offsetTop + last.offsetHeight <= H + 0.5; }
    blocks.forEach(function (b, bi) {

  function closeContents() { $('overlay').hidden = true; $('contentsBtn').focus(); }
  $('contentsBtn').addEventListener('click', function () { $('overlay').hidden = false; $('closeContents').focus(); });
  $('closeContents').addEventListener('click', closeContents);
  $('overlay').addEventListener('click', function (e) { if (e.target === $('overlay')) closeContents(); });

  var timer; window.addEventListener('resize', function () { clearTimeout(timer); timer = setTimeout(layout, 120); });
  if (document.fonts && document.fonts.load) {
    // Page breaks must be measured with the real typeface, so retypeset once all three styles are in.
    Promise.all(['400 16px "Noto Serif"', 'italic 400 16px "Noto Serif"', '700 16px "Noto Serif"'].map(function (f) { return document.fonts.load(f); }))
      .then(function () { return document.fonts.ready; })
      .then(function () {
        flowCache = {};
        if (flow) { pendingSrc = srcOf(Math.max(0, leftIndex(page))); flow = null; layout(); }
        else if (mode === 'reading') render();
      }, function () {});
  }

  layout(); showCover(false);
})();
</script>
